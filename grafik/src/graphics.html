<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Geist Mono";font-weight:400;src:url(node_modules/@fontsource/geist-mono/files/geist-mono-latin-400-normal.woff2)}
@font-face{font-family:"Geist Mono";font-weight:500;src:url(node_modules/@fontsource/geist-mono/files/geist-mono-latin-500-normal.woff2)}
@font-face{font-family:"Geist Mono";font-weight:700;src:url(node_modules/@fontsource/geist-mono/files/geist-mono-latin-700-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#777;font-family:"Geist Mono",monospace;display:flex;flex-direction:column;gap:40px;padding:40px;align-items:flex-start}
.f{position:relative;overflow:hidden;background:var(--bg);color:var(--ink);flex:none}
.f>*:not(canvas){position:relative}
.mut{color:var(--muted)} .acc{color:var(--accent)} .ink{color:var(--ink)}
.cur{display:inline-block;width:.56em;height:1.02em;background:var(--accent);vertical-align:-.16em;margin-left:.12em}
.chip{display:inline-block;padding:0 .55em;line-height:1.55} .chip.on{background:var(--accent);color:var(--bg)}
#banner{width:1500px;height:500px}
#banner .txt{position:absolute;left:800px;right:70px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
#banner .p0{font-size:19px} #banner .big{font-size:66px;font-weight:500;letter-spacing:-.045em;line-height:1;margin-top:10px;white-space:nowrap}
#banner .big b{font-weight:700;color:var(--accent)} #banner .sub{font-size:17px;margin-top:18px;line-height:1.5;max-width:30em}
#banner .row{display:flex;gap:22px;margin-top:26px;font-size:14px}
.launch{width:1600px;height:900px;font-size:16px}
#og{width:1200px;height:630px;font-size:12px}
.launch .txt{position:absolute;left:47%;right:5%;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
.launch .p0{font-size:1.45em}
.launch .big{font-size:5.4em;font-weight:500;letter-spacing:-.05em;line-height:1.02;margin-top:.2em} .launch .big b{font-weight:700;color:var(--accent)}
.launch .sub{font-size:1.45em;margin-top:.8em;max-width:28em;line-height:1.45}
.term{margin-top:2.4em;border:2px solid var(--line);background:var(--card);box-shadow:.55em .55em 0 var(--shadowc);font-size:1.15em;max-width:36em}
.term .bar{display:flex;align-items:center;gap:.5em;padding:.55em .9em;border-bottom:2px solid var(--line);font-size:.85em}
.term .bar i{width:.75em;height:.75em;border:2px solid var(--line);border-radius:50%;display:inline-block}
.term .bar span{margin-left:auto}
.term .body{padding:.9em 1.1em;line-height:1.85}
#pfp{width:1000px;height:1000px}
</style></head>
<body>
<div id="pfp" class="f"></div>
<div id="banner" class="f"></div>
<div id="launch" class="f launch"></div>
<div id="og" class="f launch"></div>
<div id="fav" class="f" style="width:180px;height:180px"></div>
<script src="termkit.js"></script>
<script>
const C = window.CFG, T = TK.THEMES[C.theme];
const esc = s => String(s).replace(/[&<>]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
const vars = `--bg:${T.bg};--ink:${T.ink};--muted:${T.muted};--accent:${T.accent};--red:${T.red};--line:${T.line};--card:${T.card};--shadowc:${T.shadow}`;
document.querySelectorAll(".f").forEach(f => f.style.cssText += vars);
const prompt = `<span class="mut">${esc(C.user)}@${esc(C.host)} ~ %</span>`;
const cmdHtml = esc(C.command).replace("the apps", "<b>the apps</b>");
function place(ctx, cell, cx, cy, opts = {}) { const g = TK.OBJECTS[C.object]({}); return TK.draw(ctx, g, Object.assign({ theme: T, cell, x: cx - g.w * cell / 2, y: cy - g.h * cell / 2 }, opts)); }
// seeded random so renders are stable
let seed = 7; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;

// ---- PFP: the handset, centered, long shadow ----
{ const ctx = TK.canvasFor(pfp), g = TK.OBJECTS[C.object]({}), cell = Math.floor(640 / Math.max(g.w, g.h)); place(ctx, cell, 500, 500); }

// ---- BANNER: the signature, no handset. Terminal lane switches at 45° into the app lane. Bottom-left stays empty for X's profile picture. ----
{ const f = banner, ctx = TK.canvasFor(f), pc = 12, yT = 120, D = pc * 11, yA = yT + D, x0 = -24, xEnd = 740, sw0 = 228, sw1 = sw0 + D;
  ctx.fillStyle = T.line;
  for (let X = x0; X < xEnd; X += pc * 2) { ctx.fillRect(X, yT + pc / 2 - 1, 3, 3); if (X > sw0 - pc * 6) ctx.fillRect(X, yA + pc / 2 - 1, 3, 3); }
  ctx.fillStyle = T.accent; ctx.globalAlpha = .45; for (let k = 0; k < D; k += pc) ctx.fillRect(sw0 + k + pc / 2 - 1, yT + k + pc / 2 - 1, 3, 3); ctx.globalAlpha = 1;
  // a second, fainter switch further on: the flow keeps moving over
  const sw2 = 470; ctx.fillStyle = T.accent; ctx.globalAlpha = .25; for (let k = 0; k < D; k += pc) ctx.fillRect(sw2 + k + pc / 2 - 1, yT + k + pc / 2 - 1, 3, 3); ctx.globalAlpha = 1;
  const pk = (x, y, col, a = 1) => { ctx.globalAlpha = a; ctx.fillStyle = col; ctx.fillRect(Math.round(x), Math.round(y), pc, pc); ctx.globalAlpha = 1; };
  const trail = (x, y, col) => { pk(x - pc * 1.4, y, col, .3); pk(x - pc * 2.8, y, col, .12); pk(x, y, col); };
  // terminal lane traffic (dense, grey), thinning out after the switches
  for (let x = 10; x < xEnd - 20; x += pc * (2.4 + rnd() * 2.2)) if (rnd() < (x < sw0 ? .95 : x < sw2 ? .55 : .3)) trail(x, yT, "#b3b8a6");
  // packets on the diagonals, turning lime halfway down
  for (const s of [sw0, sw2]) for (const k of [pc * 2, pc * 6, pc * 9]) { const y = yT + k; trail(s + k, y, k >= D / 2 ? T.accent : "#b3b8a6"); }
  // app lane traffic, denser to the right
  for (let x = sw0 + D + 6; x < xEnd; x += pc * (4.2 - (x - sw0) / 260 + rnd() * 1.4)) trail(x, yA, T.accent);
  ctx.font = '500 15px "Geist Mono", monospace'; ctx.fillStyle = T.muted; ctx.fillText("terminals + bots", 40, yT - 22);
  ctx.fillStyle = T.accent; ctx.fillText("crossover ↘", sw0 + D / 2 + pc * 2, yT + D / 2 - 4);
  ctx.fillText("apps", xEnd - 50, yA - 18);
  // arrow head at the end of the app lane
  ctx.fillStyle = T.accent; for (let i = 0; i < 4; i++) { const xx = xEnd + 6 + i * 6, d = (3 - i) * 6; ctx.fillRect(xx, yA + pc / 2 - 3 - d, 6, 6); ctx.fillRect(xx, yA + pc / 2 - 3 + d, 6, 6); }
  f.insertAdjacentHTML("beforeend", `<div class="txt"><div class="p0">${prompt} <span class="ink">crossover watch --apps</span></div><div class="big">buys when it<br>hits <b>the apps.</b><span class="cur"></span></div>
    <div class="row mut"><span><span class="acc">■</span> app share, live</span><span><span class="acc">■</span> every crossover logged</span></div></div>`);
}

// ---- LAUNCH + OG ----
for (const f of [launch, og]) { const s = f.id === "og" ? .75 : 1, W = 1600 * s, H = 900 * s;
  const ctx = TK.canvasFor(f), g = TK.OBJECTS[C.object]({}), cell = Math.floor(560 * s / Math.max(g.w, g.h));
  place(ctx, cell, W * .235, H * .47);
  const L = C.launch, lines = (L.lines || []).map(l => `<div><span class="acc">✓</span> ${esc(l)}</div>`).join("");
  f.insertAdjacentHTML("beforeend", `<div class="txt"><div class="p0">${prompt}</div><div class="big">${cmdHtml}<span class="cur"></span></div><div class="sub mut">${esc(C.sub)}</div>
    <div class="term"><div class="bar"><i></i><i></i><i></i><span class="mut">${esc(C.host)} — zsh</span></div>
    <div class="body"><div>${prompt} <span class="ink">${esc(L.cmd)}</span></div>${lines}<div><span class="mut">status</span>  <span class="chip on"><b>LIVE</b></span></div></div></div></div>`);
}
// ---- FAVICON ----
{ const ctx = TK.canvasFor(fav), g = TK.OBJECTS[C.object]({}), cell = Math.floor(160 / Math.max(g.w, g.h));
  TK.draw(ctx, g, { theme: T, cell, x: (180 - g.w * cell) / 2, y: (180 - g.h * cell) / 2, shadow: false }); }
document.fonts.ready.then(() => document.body.dataset.ready = 1);
</script>
</body></html>
